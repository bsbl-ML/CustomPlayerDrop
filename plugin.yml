name: CustomPlayerDrop
version: '${version}' # pull version number from gradle.properties
main: CustomPlayerDrop.Sandrix.Dev.Main
api-version: '1.21'

authors: [Sandrix33, bsbl-ML]
description: Revised plugin for custom player drop (Celestiql SMP)

commands:
  customplayerdrop:
    description: Manage CustomPlayerDrop (reload config or test drop features)
    usage: /customplayerdrop <reload|give>
    permission: customplayerdrop.admin

permissions:
  customplayerdrop.admin:
    description: Allows access to CustomPlayerDrop administrative commands
    default: op

  customplayerdrop.enabled:
    description: Allows CustomPlayerDrop drops to apply to the player
    default: true
